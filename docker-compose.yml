services:
  api:
    build: .
    ports:
      - "8007:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-home_care_api}
      # JWT_SECRET, JWT_EXPIRES_IN and FRONTEND_ORIGIN come from .env (env_file above).
      # Defaults to production so a deploy never auto-creates the dev test
      # accounts (see db/seed.js). Set NODE_ENV=development in .env to get them.
      NODE_ENV: ${NODE_ENV:-production}
      TRUST_PROXY: ${TRUST_PROXY:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-home_care_api}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. Without it, pg_isready can pass against
      # Postgres's temporary init server (unix socket only) before the real
      # server is up, and the API's startup schema/seed step would fail.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
